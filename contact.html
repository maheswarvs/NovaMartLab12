<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – NOVA MART</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap"><div class="page-head"><h1>Contact us</h1></div>
<div class="contact"><form id="contact-form" novalidate><label>Your name<input name="name" type="text" autocomplete="name"><span class="err" data-err="name"></span></label><label>Email<input name="email" type="email" autocomplete="email"><span class="err" data-err="email"></span></label><label>Subject<input name="subject" type="text" ><span class="err" data-err="subject"></span></label><label>Message<textarea name="message" rows="5" ></textarea><span class="err" data-err="message"></span></label><button class="btn dark" type="submit">Send message</button><p class="form-msg" role="status"></p></form>
<div class="info"><h2>Customer care</h2><p>care@novamart.example<br>+91 80 4000 1234<br>Mon–Sat, 9:00 am – 7:00 pm</p>
<h2>Our store</h2><p><b>NOVA MART Flagship</b><br>42 Residency Road, Bengaluru 560025<br>Open daily, 10:30 am – 9:00 pm</p>
<a class="btn line" href="https://www.google.com/maps/search/?api=1&query=Residency+Road+Bengaluru" target="_blank" rel="noopener">Get directions</a>
<h2>Follow us</h2><div class="social"><a href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram">IG</a><a href="https://www.facebook.com/" target="_blank" rel="noopener" aria-label="Facebook">FB</a><a href="https://x.com/" target="_blank" rel="noopener" aria-label="X">X</a><a href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="YouTube">YT</a></div></div></div></main>
<div id="site-footer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
