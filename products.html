<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop all – NOVA MART</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap">
<div class="page-head"><h1>Shop all products</h1><p id="shop-count"></p></div>
<div class="shop"><aside><h2>Categories</h2><div id="cat-filter"></div></aside>
<div><div class="toolbar"><label>Search<input id="shop-q" type="search" placeholder="Search by name, category or description"></label>
<label>Sort by<select id="shop-sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="rating">Top rated</option></select></label></div>
<div id="shop-grid" class="grid"></div></div></div></main>
<div id="site-footer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script src="js/products.js"></script>
</body>
</html>
