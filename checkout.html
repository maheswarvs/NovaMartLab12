<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkout – NOVA MART</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="site-header"></header>
<main class="wrap"><div class="page-head"><h1>Checkout</h1></div>
<div id="checkout-area"><div class="co-layout"><form id="checkout-form" novalidate>
<fieldset><legend>Delivery details</legend>
<div class="two"><label>Full name<input name="name" type="text" autocomplete="name"><span class="err" data-err="name"></span></label><label>Email<input name="email" type="email" autocomplete="email"><span class="err" data-err="email"></span></label></div>
<div class="two"><label>Phone number<input name="phone" type="tel" autocomplete="tel" placeholder="10-digit mobile"><span class="err" data-err="phone"></span></label><label>City<input name="city" type="text" autocomplete="address-level2"><span class="err" data-err="city"></span></label></div>
<label>Delivery address<textarea name="address" rows="5" autocomplete="street-address"></textarea><span class="err" data-err="address"></span></label><label>PIN code<input name="pincode" type="text" inputmode="numeric" maxlength="6" autocomplete="postal-code"><span class="err" data-err="pincode"></span></label></fieldset>
<fieldset><legend>Payment method</legend>
<div class="pay"><label><input type="radio" name="payment" value="cod" checked>Cash on delivery</label></div>
<div class="pay"><label><input type="radio" name="payment" value="online">Online payment (simulated)</label></div>
<div id="card-fields" hidden><p class="notice">This is a simulation. No payment is processed and card details are never saved. Do not enter a real card number.</p>
<label>Card number<input name="card" type="text" inputmode="numeric" placeholder="1234 5678 9012 3456"><span class="err" data-err="card"></span></label><div class="two"><label>Expiry (MM/YY)<input name="expiry" type="text" placeholder="08/29" maxlength="5"><span class="err" data-err="expiry"></span></label><label>CVV<input name="cvv" type="text" inputmode="numeric" maxlength="3"><span class="err" data-err="cvv"></span></label></div></div></fieldset>
<button class="btn dark" type="submit">Place order</button></form>
<aside class="box"><h2>Order summary</h2><div id="co-lines"></div>
<div class="sum-row"><span>Subtotal</span><span id="co-sub"></span></div><div class="sum-row"><span>Delivery</span><span id="co-ship"></span></div>
<div class="sum-row total"><span>Total</span><span id="co-total"></span></div></aside></div></div></main>
<div id="site-footer"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/main.js"></script>
<script src="js/cart.js"></script>
<script src="js/checkout.js"></script>
</body>
</html>
